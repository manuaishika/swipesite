name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:pw@localhost:5432/ci
      NEXTAUTH_SECRET: ci-secret
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Migrations apply to an empty database
        run: node scripts/migrate.mjs
      - name: Schema matches migrations
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: Practice integration tests
        run: npm run test:practice
      - name: Build
        run: npx next build
      - name: Install Chromium for the end-to-end test
        run: npx playwright-core install --with-deps chromium
      - name: End-to-end smoke test (production build, stand-in arXiv)
        env:
          ARXIV_API_URL: http://localhost:9911/api/query
          BASE: http://localhost:3000
        run: |
          node scripts/mock-arxiv.mjs &
          npx next start -p 3000 > next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/about > /dev/null && break; sleep 1; done
          npm run test:e2e || (tail -50 next.log; exit 1)
